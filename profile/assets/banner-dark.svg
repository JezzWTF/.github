<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="JezzWTF — rebuilding the things i used to pay for">
  <defs>
    <style>
      @font-face{font-family:'JWSyne';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
      @font-face{font-family:'JWMono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
      .mark{font-family:'JWSyne',ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:78px;letter-spacing:-2px}
      .sub{font-family:'JWMono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;letter-spacing:.2px}
      .tag{font-family:'JWMono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:1.4px}
      .lbl{font-family:'JWMono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.5px}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/><stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fc9f30" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fc9f30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fc9f30"/><stop offset="1" stop-color="#fc9f30" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.3" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect x="655" y="-150" width="600" height="600" fill="url(#glow)"/>

    <!-- architecture motif: one hub, many clients -->
    <circle cx="955" cy="150" r="132" fill="none" stroke="#232830" stroke-width="1"/>
    <circle cx="955" cy="150" r="132" fill="none" stroke="#fc9f30" stroke-width="1" opacity=".22"
            stroke-dasharray="3 9"/>
    <line x1="955" y1="150" x2="837" y2="92" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="837" cy="92" r="6" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <line x1="955" y1="150" x2="961" y2="34" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="961" cy="34" r="5" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
    <line x1="955" y1="150" x2="1075" y2="98" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="1075" cy="98" r="6.5" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="1.10s" repeatCount="indefinite"/>
    </circle>
    <line x1="955" y1="150" x2="1067" y2="208" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="1067" cy="208" r="5" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="1.65s" repeatCount="indefinite"/>
    </circle>
    <line x1="955" y1="150" x2="941" y2="268" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="941" cy="268" r="6" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="2.20s" repeatCount="indefinite"/>
    </circle>
    <line x1="955" y1="150" x2="835" y2="202" stroke="#fc9f30" stroke-width="1" opacity=".28"/>
    <circle cx="835" cy="202" r="5.5" fill="#fc9f30" opacity=".75">
      <animate attributeName="opacity" values=".75;.3;.75" dur="4.5s" begin="2.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="955" cy="150" r="34" fill="#05070c" stroke="#fc9f30" stroke-width="1.5"/>
    <text class="lbl" x="955" y="155" fill="#fc9f30" text-anchor="middle">api</text>

    <!-- wordmark -->
    <text class="mark" x="72" y="152" fill="#eae8e1">Jezz<tspan fill="#fc9f30">WTF</tspan></text>
    <rect x="74" y="176" width="176" height="2" fill="url(#rule)"/>
    <text class="sub" x="74" y="214" fill="#79818d">rebuilding the things i used to pay for</text>
    <text class="tag" x="74" y="252" fill="#fc9f30" opacity=".85">jezz.wtf</text>

    <rect y="297" width="1200" height="3" fill="url(#rule)"/>
    <rect width="1200" height="300" rx="18" fill="none" stroke="#232830" stroke-width="2"/>
  </g>
</svg>
